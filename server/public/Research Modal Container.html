<!-- Research Modal Container -->
<div id="research-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Academy Research Tree</h2>
      <button class="close-btn" onclick="closeResearchGui()">&times;</button>
    </div>

    <!-- Discipline Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchDiscipline('economy')">Economy</button>
      <button class="tab-btn" onclick="switchDiscipline('military')">Military</button>
      <button class="tab-btn" onclick="switchDiscipline('construction')">Construction</button>
      <button class="tab-btn" onclick="switchDiscipline('intelligence')">Intelligence</button>
      <button class="tab-btn" onclick="switchDiscipline('movement')">Movement</button>
      <button class="tab-btn" onclick="switchDiscipline('defense')">Defense</button>
    </div>

    <!-- Tech Grid -->
    <div id="tech-container" class="tech-grid"></div>
  </div>
</div>

<!-- Alert / Requirements Pop-up -->
<div id="alert-popup" class="popup-overlay hidden">
  <div class="popup-box">
    <h3 id="popup-title">Requirements Not Met</h3>
    <p id="popup-message"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<style>
  .hidden { display: none !important; }
  .modal-overlay, .popup-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center;
  }
  .modal-content { background: #222; color: #fff; width: 800px; padding: 20px; border-radius: 8px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; }
  .tab-bar { display: flex; gap: 10px; margin: 15px 0; border-bottom: 1px solid #444; flex-wrap: wrap; }
  .tab-btn { background: none; border: none; color: #aaa; padding: 10px 15px; cursor: pointer; font-size: 16px; }
  .tab-btn.active { color: #fff; border-bottom: 2px solid #e2b041; font-weight: bold; }
  .tech-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-height: 400px; overflow-y: auto; }
  
  .tech-card { background: #333; padding: 15px; border-radius: 6px; border: 1px solid #444; }
  .tech-card.locked { opacity: 0.6; }
  .cost-list { font-size: 0.85em; color: #ccc; margin: 8px 0; }
  .research-btn { background: #e2b041; color: #111; border: none; padding: 8px 12px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; }
  .research-btn:hover { background: #d4a030; }

  .popup-box { background: #2a1a1a; border: 1px solid #ff4d4d; color: #fff; padding: 20px; border-radius: 6px; text-align: center; max-width: 350px; }
  .popup-box button { margin-top: 15px; padding: 6px 20px; background: #ff4d4d; border: none; color: white; cursor: pointer; }
</style>

<script>
let currentCityId = 1;
let researchTreeData = null;
let currentDiscipline = 'economy';

// Mapping frontend tab names to database group / discipline names
const DISCIPLINE_MAP = {
  economy: ['economy', 'tax'],
  military: ['military'],
  construction: ['development', 'construction'],
  intelligence: ['intelligence', 'society'],
  movement: ['movement', 'development'],
  defense: ['defense', 'military']
};

/**
 * 1. Fetch Research State & Render
 */
async function openResearchGui(cityId = 1) {
  currentCityId = cityId;
  document.getElementById('research-modal').classList.remove('hidden');

  try {
    const res = await fetch(`/api/research?cityId=${cityId}`);
    const data = await res.json();

    if (!data.success) {
      showRequirementPopup('Error', data.error || 'Failed to load research tree.');
      return;
    }

    researchTreeData = data;
    renderTechs();
  } catch (err) {
    showRequirementPopup('Error', 'Could not connect to the server.');
  }
}

function closeResearchGui() {
  document.getElementById('research-modal').classList.add('hidden');
}

function switchDiscipline(discipline) {
  currentDiscipline = discipline;
  document.querySelectorAll('.tab-bar .tab-btn').forEach(btn => btn.classList.remove('active'));
  
  if (window.event && window.event.target) {
    window.event.target.classList.add('active');
  }
  renderTechs();
}

/**
 * 2. Dynamic Tech Grid Renderer
 */
function renderTechs() {
  const container = document.getElementById('tech-container');
  container.innerHTML = '';

  if (!researchTreeData || !researchTreeData.technologies) return;

  const academyLevel = researchTreeData.academyLevel || 0;
  const activeQueue = researchTreeData.activeQueue;
  const allowedGroups = DISCIPLINE_MAP[currentDiscipline] || [currentDiscipline];

  Object.entries(researchTreeData.technologies).forEach(([code, tech]) => {
    // Check group / discipline filter compatibility
    const techDiscipline = (tech.discipline || 'economy').toLowerCase();
    if (!allowedGroups.includes(techDiscipline)) return;

    const currentLevel = tech.globalLevel || 0;
    const targetLevel = currentLevel + 1;
    const reqAcademy = tech.requiredAcademyLevel || 1;
    const isAcademyMet = academyLevel >= reqAcademy;
    const isMaxed = tech.maxLevel && currentLevel >= tech.maxLevel;

    const card = document.createElement('div');
    card.className = `tech-card ${(!isAcademyMet || isMaxed) ? 'locked' : ''}`;

    let prereqText = '';
    if (tech.prerequisite) {
      const prereqCode = tech.prerequisite.tech;
      const prereqName = researchTreeData.technologies[prereqCode]?.name || prereqCode;
      prereqText = `<br/><small>Requires ${prereqName} (Level ${tech.prerequisite.level})</small>`;
    }

    const costList = tech.nextLevelCost ? `
      Food: ${tech.nextLevelCost.food || 0} | Wood: ${tech.nextLevelCost.wood || 0} | 
      Stone: ${tech.nextLevelCost.stone || 0} | Iron: ${tech.nextLevelCost.iron || 0} | 
      Gold: ${tech.nextLevelCost.gold || 0}
    ` : 'None';

    const isCurrentlyResearching = activeQueue?.tech_code === code;

    card.innerHTML = `
      <h3>${tech.name} <small>(Lvl ${currentLevel}${tech.maxLevel ? '/' + tech.maxLevel : ''})</small></h3>
      <p>${tech.description || 'Enhances settlement capabilities.'}</p>
      
      <div class="cost-list">
        <strong>Next Level (${targetLevel}) Cost:</strong><br/>
        ${isMaxed ? 'Max Level Reached' : costList}
      </div>
      <p><small>Requires Academy Level: ${reqAcademy}</small>${prereqText}</p>

      <button class="research-btn" 
              ${(isMaxed || isCurrentlyResearching) ? 'disabled' : ''} 
              onclick="attemptResearch('${code}', ${targetLevel}, ${reqAcademy})">
        ${isCurrentlyResearching ? 'Researching...' : (isMaxed ? 'Maxed' : 'Research')}
      </button>
    `;

    container.appendChild(card);
  });
}

/**
 * 3. Client Requirements Validation
 */
function attemptResearch(techCode, targetLevel, requiredAcademyLevel) {
  const academyLevel = researchTreeData.academyLevel || 0;
  const tech = researchTreeData.technologies ? researchTreeData.technologies[techCode] : null;

  if (!tech) {
    showRequirementPopup('Error', 'Invalid technology code selection.');
    return;
  }

  // Check 1: Max Level
  if (tech.maxLevel && targetLevel > tech.maxLevel) {
    showRequirementPopup('Max Level Reached', `${tech.name} is already at its maximum level (${tech.maxLevel}).`);
    return;
  }

  // Check 2: Active Queue
  if (researchTreeData.activeQueue) {
    showRequirementPopup(
      'Research Queue Busy',
      `Your Academy is busy. Currently researching ${researchTreeData.activeQueue.tech_code}.`
    );
    return;
  }

  // Check 3: Academy Building Gate
  if (academyLevel < requiredAcademyLevel) {
    showRequirementPopup(
      'Academy Level Too Low',
      `Upgrade your Academy to Level ${requiredAcademyLevel} to unlock this research.`
    );
    return;
  }

  // Check 4: Primary & Cross Prerequisite Techs
  if (tech.prerequisite) {
    const prereqCode = tech.prerequisite.tech;
    const prereqTech = researchTreeData.technologies[prereqCode];
    const prereqCurrentLevel = prereqTech ? (prereqTech.globalLevel || 0) : 0;
    
    if (prereqCurrentLevel < tech.prerequisite.level) {
      const prereqName = prereqTech ? prereqTech.name : prereqCode;
      showRequirementPopup(
        'Prerequisite Not Met',
        `Requires ${prereqName} Level ${tech.prerequisite.level} (Current: Lvl ${prereqCurrentLevel}).`
      );
      return;
    }
  }

  // Send start payload if checks pass
  sendStartResearchRequest(techCode, targetLevel);
}

/**
 * 4. Post Payload to Backend Route
 */
async function sendStartResearchRequest(techCode, targetLevel) {
  try {
    const res = await fetch('/api/research/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cityId: currentCityId,
        techCode: techCode,
        targetLevel: targetLevel
      })
    });

    const data = await res.json();

    if (!data.success) {
      showRequirementPopup('Research Failed', data.error || 'Server rejected the request.');
    } else {
      openResearchGui(currentCityId); // Reload GUI state and update resources/queue
    }
  } catch (err) {
    showRequirementPopup('Error', 'Failed to communicate with the server.');
  }
}

// Dialog Handlers
function showRequirementPopup(title, message) {
  document.getElementById('popup-title').innerText = title;
  document.getElementById('popup-message').innerText = message;
  document.getElementById('alert-popup').classList.remove('hidden');
}

function closePopup() {
  document.getElementById('alert-popup').classList.add('hidden');
}
</script>
